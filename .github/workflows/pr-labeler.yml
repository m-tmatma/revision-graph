name: PR Labeler

# Labels a PR from its title's conventional-commit-style prefix (feat:,
# fix:, change:, refactor:, i18n:, docs:, ci:, chore:), so .github/release.yml
# can sort merged PRs into categories for the auto-generated release notes
# without anyone hand-labeling PRs. A title with no matching prefix is left
# unlabeled (it'll land in release.yml's catch-all "Other Changes" category).

on:
  pull_request:
    types: [opened, edited]

permissions:
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply label from title prefix
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          case "$TITLE" in
            feat:*) label=feat ;;
            fix:*) label=fix ;;
            change:*) label=spec-change ;;
            refactor:*) label=refactor ;;
            i18n:*) label=i18n ;;
            docs:*) label=docs ;;
            ci:*) label=ci ;;
            chore:*) label=chore ;;
            *) label="" ;;
          esac

          # Remove any other managed label first -- this workflow also runs
          # on `edited`, and a title changing prefix (e.g. feat: -> fix:)
          # would otherwise leave the old label stuck alongside the new one.
          # No `|| true` here: removing a label the PR never had is already a
          # no-op success (gh only errors if the label doesn't exist in the
          # repo at all), so a failure here is a real one worth failing the
          # workflow over, not one to silently swallow.
          remove_args=""
          for managed in feat fix spec-change refactor i18n docs ci chore; do
            if [ "$managed" != "$label" ]; then
              remove_args="$remove_args --remove-label $managed"
            fi
          done
          gh pr edit "$PR_NUMBER" --repo "$REPO" $remove_args

          if [ -n "$label" ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$label"
          fi
