name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - run: npm run vsix
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Stage release artifact
        env:
          ARCHIVE_NAME: vsix-v${{ steps.version.outputs.version }}-build${{ github.run_number }}.tar.gz
        run: |
          mkdir -p release
          cp *.vsix scripts/install.bat scripts/install.sh scripts/install.command scripts/install-remote-ssh.sh release/
          # upload-artifact resets every uploaded file to 644, dropping the
          # executable bit the installer scripts need (install.sh,
          # install.command, install-remote-ssh.sh are tracked as mode
          # 100755) -- tar preserves it, and archive: false below uploads
          # this tar as-is instead of re-zipping it inside an artifact zip.
          # With archive: false the uploaded file's own name becomes the
          # artifact's name (upload-artifact's `name:` input is ignored),
          # hence naming the tarball itself here instead.
          tar -czf "$ARCHIVE_NAME" -C release .
      - uses: actions/upload-artifact@v7
        with:
          path: vsix-v${{ steps.version.outputs.version }}-build${{ github.run_number }}.tar.gz
          archive: false
