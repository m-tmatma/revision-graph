name: CI

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - run: npm run vsix
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Stage release artifact
        run: |
          mkdir -p release
          cp *.vsix scripts/install.bat scripts/install.sh scripts/install.command scripts/install-remote-ssh.sh release/
      - uses: actions/upload-artifact@v7
        with:
          name: vsix-v${{ steps.version.outputs.version }}-build${{ github.run_number }}
          path: release/*
