<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="__CSP__" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Git Revision Graph</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: var(--vscode-sideBar-background, var(--vscode-editor-background));
      color: var(--vscode-foreground);
      font-family: var(--vscode-font-family, sans-serif);
      font-size: var(--vscode-font-size, 13px);
    }
    main {
      padding: 16px;
    }
    h1 {
      font-size: 1.1em;
      margin: 0 0 12px;
    }
    p {
      opacity: 0.85;
      line-height: 1.4;
      margin: 0 0 16px;
    }
    button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      background: var(--vscode-button-background);
      color: var(--vscode-button-foreground);
      border: none;
      border-radius: 2px;
      padding: 6px 12px;
      font: inherit;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button:hover {
      background: var(--vscode-button-hoverBackground);
    }
    #version-section {
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px solid var(--vscode-panel-border, #454545);
    }
    #version-text {
      opacity: 0.7;
      font-family: var(--vscode-editor-font-family, monospace);
      font-size: 0.9em;
      margin-bottom: 8px;
      word-break: break-all;
    }
    #copy-button {
      background: var(--vscode-button-secondaryBackground, transparent);
      color: var(--vscode-button-secondaryForeground, inherit);
      border: 1px solid var(--vscode-button-border, var(--vscode-panel-border, #454545));
    }
    #copy-button:hover {
      background: var(--vscode-button-secondaryHoverBackground, var(--vscode-list-hoverBackground));
    }
  </style>
</head>
<body>
  <main>
    <h1 data-i18n="Git Revision Graph">Git Revision Graph</h1>
    <p data-i18n="Visualize this repository's commit history as a graph.">Visualize this repository's commit history as a graph.</p>
    <button id="show-button" type="button" data-i18n="Show Revision Graph">Show Revision Graph</button>
    <div id="version-section">
      <div id="version-text">__VERSION_TEXT__</div>
      <button id="copy-button" type="button" data-i18n="Copy version info">Copy version info</button>
    </div>
  </main>
  <script nonce="__NONCE__">
    window.__L10N_BUNDLE__ = __L10N_BUNDLE_JSON__;
  </script>
  <script nonce="__NONCE__" src="__SCRIPT_URI__"></script>
</body>
</html>
