<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="__CSP__" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Changed Files</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: var(--vscode-editor-background);
      color: var(--vscode-editor-foreground);
      font-family: var(--vscode-font-family, sans-serif);
      font-size: var(--vscode-font-size, 13px);
    }
    #header {
      padding: 12px;
      border-bottom: 1px solid var(--vscode-panel-border, #454545);
    }
    #header .label {
      opacity: 0.7;
    }
    #header .rev {
      font-family: var(--vscode-editor-font-family, monospace);
      margin: 2px 0 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      text-align: left;
      padding: 4px 12px;
      border-bottom: 1px solid var(--vscode-panel-border, #333333);
      white-space: nowrap;
    }
    th:first-child, td:first-child {
      white-space: normal;
      width: 100%;
    }
    tbody tr {
      cursor: pointer;
    }
    tbody tr:hover,
    tbody tr:focus-visible {
      background: var(--vscode-list-hoverBackground);
    }
    tbody tr:focus-visible {
      outline: 1px solid var(--vscode-focusBorder, #007fd4);
      outline-offset: -1px;
    }
    .added {
      color: var(--vscode-gitDecoration-addedResourceForeground, #81b88b);
    }
    .deleted {
      color: var(--vscode-gitDecoration-deletedResourceForeground, #c74e39);
    }
    .empty-state {
      opacity: 0.7;
      cursor: default;
    }
    .empty-state:hover {
      background: transparent;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="visually-hidden" data-i18n="Changed Files">Changed Files</h1>
    <div id="header">
      <div class="label" data-i18n="Comparing">Comparing</div>
      <div class="rev" id="from-rev"></div>
      <div class="rev" id="to-rev"></div>
    </div>
    <table>
      <thead>
        <tr>
          <th data-i18n="File">File</th>
          <th data-i18n="Ext">Ext</th>
          <th data-i18n="Action">Action</th>
          <th data-i18n="Added">Added</th>
          <th data-i18n="Deleted">Deleted</th>
        </tr>
      </thead>
      <tbody id="file-list">
        <tr>
          <td colspan="5" data-i18n="Loading…">Loading…</td>
        </tr>
      </tbody>
    </table>
  </main>
  <script nonce="__NONCE__">
    window.__L10N_BUNDLE__ = __L10N_BUNDLE_JSON__;
    window.__LANG__ = "__LANG__";
  </script>
  <script nonce="__NONCE__" src="__SCRIPT_URI__"></script>
</body>
</html>
