<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="__CSP__" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--vscode-editor-background);
      color: var(--vscode-editor-foreground);
      font-family: var(--vscode-font-family, sans-serif);
      font-size: var(--vscode-font-size, 13px);
    }
    body {
      overflow: hidden;
    }
    main {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    #sidebar-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--vscode-panel-border, #454545);
    }
    #show-button {
      background: var(--vscode-button-background);
      color: var(--vscode-button-foreground);
      border: none;
      border-radius: 2px;
      padding: 4px 10px;
      font: inherit;
      cursor: pointer;
    }
    #show-button:hover {
      background: var(--vscode-button-hoverBackground);
    }
    #version-button {
      flex: 0 0 auto;
      background: transparent;
      color: inherit;
      opacity: 0.7;
      border: 1px solid var(--vscode-button-border, var(--vscode-panel-border, #454545));
      border-radius: 50%;
      width: 22px;
      height: 22px;
      line-height: 1;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }
    #version-button:hover {
      opacity: 1;
      background: var(--vscode-list-hoverBackground);
    }
    #commit-list {
      flex: 1 1 auto;
      overflow-y: auto;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .commit-row {
      border-bottom: 1px solid var(--vscode-panel-border, #333333);
    }
    .commit-row-main {
      display: flex;
      align-items: stretch;
      cursor: pointer;
    }
    .lane-graph {
      flex: 0 0 auto;
      align-self: center;
    }
    .commit-row button.commit-button {
      flex: 1 1 auto;
      display: block;
      min-height: 40px;
      width: 100%;
      text-align: left;
      background: transparent;
      color: inherit;
      border: none;
      padding: 4px 12px 4px 4px;
      font: inherit;
      cursor: pointer;
      box-sizing: border-box;
    }
    .commit-row-main:hover .commit-button {
      background: var(--vscode-list-hoverBackground);
    }
    .commit-row button.commit-button[aria-expanded='true'] {
      background: var(--vscode-list-activeSelectionBackground, #094771);
      color: var(--vscode-list-activeSelectionForeground, inherit);
    }
    .subject {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .merge-badge {
      display: inline-block;
      margin-right: 6px;
      padding: 0 4px;
      font-size: 0.75em;
      line-height: 1.4;
      border-radius: 3px;
      background: var(--vscode-badge-background, #4d4d4d);
      color: var(--vscode-badge-foreground, #ffffff);
      vertical-align: middle;
    }
    .ref-badge {
      display: inline-block;
      margin-right: 6px;
      padding: 0 4px;
      font-size: 0.75em;
      line-height: 1.4;
      border-radius: 3px;
      vertical-align: middle;
    }
    .compare-badge {
      display: inline-block;
      margin-right: 6px;
      padding: 0 5px;
      font-size: 0.75em;
      font-weight: bold;
      line-height: 1.4;
      border-radius: 50%;
      background: var(--vscode-focusBorder, #007fd4);
      color: #ffffff;
      vertical-align: middle;
    }
    .compare-badge[hidden] {
      display: none;
    }
    .meta {
      display: block;
      opacity: 0.7;
      font-size: 0.9em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .file-list[hidden] {
      display: none;
    }
    .file-row button {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      text-align: left;
      background: transparent;
      color: inherit;
      border: none;
      padding: 3px 12px;
      font: inherit;
      cursor: pointer;
    }
    .file-row button:hover {
      background: var(--vscode-list-hoverBackground);
    }
    .file-path {
      flex: 1 1 auto;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-status {
      flex: 0 0 auto;
      font-weight: bold;
    }
    .file-status.status-added {
      color: var(--vscode-gitDecoration-addedResourceForeground, #81b88b);
    }
    .file-status.status-deleted {
      color: var(--vscode-gitDecoration-deletedResourceForeground, #c74e39);
    }
    .file-status.status-modified {
      color: var(--vscode-gitDecoration-modifiedResourceForeground, #e2c08d);
    }
    .file-status.status-other {
      opacity: 0.7;
    }
    .file-list-status {
      padding: 3px 12px;
      opacity: 0.7;
    }
    .file-list-status.error {
      color: var(--vscode-errorForeground, #f14c4c);
      opacity: 1;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="visually-hidden" data-i18n="Commit Log">Commit Log</h1>
    <div id="sidebar-header">
      <button id="show-button" type="button" data-i18n="Show Revision Graph">Show Revision Graph</button>
      <button id="version-button" type="button" title="Version info" aria-label="Version info">ℹ</button>
    </div>
    <ul id="commit-list">
      <li><span data-i18n="Loading…">Loading…</span></li>
    </ul>
  </main>
  <script nonce="__NONCE__">
    window.__L10N_BUNDLE__ = __L10N_BUNDLE_JSON__;
  </script>
  <script nonce="__NONCE__" src="__SCRIPT_URI__"></script>
</body>
</html>
