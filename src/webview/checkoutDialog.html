<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="__CSP__" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Switch / Checkout</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: var(--vscode-editor-background);
      color: var(--vscode-editor-foreground);
      font-family: var(--vscode-font-family, sans-serif);
      font-size: var(--vscode-font-size, 13px);
    }
    main {
      padding: 16px;
      max-width: 420px;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    #target-section {
      margin-bottom: 16px;
    }
    #target-section .label {
      opacity: 0.7;
      margin-bottom: 4px;
    }
    #target-label {
      font-family: var(--vscode-editor-font-family, monospace);
      padding: 4px 8px;
      background: var(--vscode-input-background, #3c3c3c);
      border-radius: 2px;
    }
    fieldset {
      border: 1px solid var(--vscode-panel-border, #454545);
      border-radius: 4px;
      padding: 8px 12px 12px;
      margin: 0 0 16px;
    }
    legend {
      padding: 0 4px;
      opacity: 0.7;
    }
    fieldset label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
    }
    fieldset label.indent {
      margin-left: 22px;
    }
    #new-branch-name {
      flex: 1;
      background: var(--vscode-input-background);
      color: var(--vscode-input-foreground);
      border: 1px solid var(--vscode-input-border, transparent);
      border-radius: 2px;
      padding: 2px 4px;
      font: inherit;
    }
    #actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    button {
      background: var(--vscode-button-secondaryBackground, transparent);
      color: var(--vscode-button-secondaryForeground, inherit);
      border: 1px solid var(--vscode-button-border, var(--vscode-panel-border, #454545));
      border-radius: 2px;
      padding: 4px 14px;
      font: inherit;
      cursor: pointer;
    }
    #ok-button {
      background: var(--vscode-button-background);
      color: var(--vscode-button-foreground);
      border-color: transparent;
    }
    #ok-button:hover {
      background: var(--vscode-button-hoverBackground);
    }
  </style>
</head>
<body>
  <main>
    <h1 class="visually-hidden">Switch / Checkout</h1>
    <div id="target-section">
      <div class="label">Switch to</div>
      <div id="target-label"></div>
    </div>
    <fieldset>
      <legend>Options</legend>
      <label>
        <input type="checkbox" id="create-branch" />
        Create new branch
        <input type="text" id="new-branch-name" placeholder="branch name" disabled />
      </label>
      <label class="indent">
        <input type="checkbox" id="track" disabled />
        Track
      </label>
      <label class="indent">
        <input type="checkbox" id="overwrite-existing" disabled />
        Overwrite existing branch if present
      </label>
      <label>
        <input type="checkbox" id="force" />
        Force (overwrite local changes)
      </label>
      <label>
        <input type="checkbox" id="merge" />
        Merge local changes
      </label>
    </fieldset>
    <div id="actions">
      <button id="cancel-button" type="button">Cancel</button>
      <button id="ok-button" type="button">OK</button>
    </div>
  </main>
  <script nonce="__NONCE__" src="__SCRIPT_URI__"></script>
</body>
</html>
