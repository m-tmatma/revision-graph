<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="__CSP__" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Git Revision Graph</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--vscode-editor-background);
      color: var(--vscode-editor-foreground);
      font-family: var(--vscode-font-family, sans-serif);
      font-size: var(--vscode-font-size, 13px);
    }
    body {
      overflow: hidden;
    }
    main {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    #toolbar {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 6px 12px;
      border-bottom: 1px solid var(--vscode-panel-border, #454545);
    }
    #toolbar label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    #toolbar select,
    #toolbar input[type='text'] {
      background: var(--vscode-input-background);
      color: var(--vscode-input-foreground);
      border: 1px solid var(--vscode-input-border, transparent);
      border-radius: 2px;
      padding: 2px 4px;
      font: inherit;
    }
    #toolbar input[type='text'] {
      width: 8em;
    }
    #toolbar button {
      background: var(--vscode-button-background);
      color: var(--vscode-button-foreground);
      border: none;
      border-radius: 2px;
      padding: 3px 10px;
      font: inherit;
      cursor: pointer;
    }
    #toolbar button:hover {
      background: var(--vscode-button-hoverBackground);
    }
    #range-inputs[hidden] {
      display: none;
    }
    #graph-scroll {
      flex: 1 1 auto;
      overflow: hidden;
      position: relative;
    }
    #graph-status {
      padding: 12px;
      opacity: 0.7;
    }
    #graph-root {
      position: absolute;
      inset: 0;
    }
    #minimap {
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: 260px;
      height: 200px;
      background: var(--vscode-editorWidget-background, #252526);
      border: 1px solid var(--vscode-panel-border, #454545);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      touch-action: none;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="visually-hidden" data-i18n="Git Revision Graph">Git Revision Graph</h1>
    <div id="toolbar">
      <label for="scope-select">
        <span data-i18n="Scope">Scope</span>
        <select id="scope-select">
          <option value="all-branches" selected data-i18n="All branches">All branches</option>
          <option value="local-branches" data-i18n="Local branches">Local branches</option>
          <option value="current-branch" data-i18n="Current branch">Current branch</option>
          <option value="range" data-i18n="From..To range">From..To range</option>
        </select>
      </label>
      <span id="range-inputs" hidden>
        <label for="range-from"
          ><span data-i18n="From">From</span>
          <input id="range-from" type="text" placeholder="(optional)" data-i18n-placeholder="(optional)"
        /></label>
        <label for="range-to"
          ><span data-i18n="To">To</span> <input id="range-to" type="text" placeholder="HEAD" data-i18n-placeholder="HEAD"
        /></label>
      </span>
      <label for="show-branches-merges-toggle">
        <input id="show-branches-merges-toggle" type="checkbox" checked />
        <span data-i18n="Show branches and merges">Show branches and merges</span>
      </label>
      <label for="show-tags-toggle">
        <input id="show-tags-toggle" type="checkbox" checked />
        <span data-i18n="Show all tags">Show all tags</span>
      </label>
      <button id="refresh-button" type="button" data-i18n="Refresh">Refresh</button>
      <button id="fetch-button" type="button" data-i18n="Fetch">Fetch</button>
      <button id="checkout-button" type="button" data-i18n="Checkout…">Checkout…</button>
      <button id="delete-merged-branches-button" type="button" data-i18n="Delete Merged Branches…">Delete Merged Branches…</button>
      <button id="export-svg-button" type="button" data-i18n="Export SVG">Export SVG</button>
      <button id="export-png-button" type="button" data-i18n="Export PNG">Export PNG</button>
    </div>
    <div id="graph-scroll">
      <div id="graph-status" data-i18n="Loading revision graph…">Loading revision graph…</div>
      <div id="graph-root"></div>
      <div id="minimap"></div>
    </div>
  </main>
  <script nonce="__NONCE__">
    window.__LAYOUT_WORKER_URI__ = "__WORKER_URI__";
    window.__L10N_BUNDLE__ = __L10N_BUNDLE_JSON__;
  </script>
  <script nonce="__NONCE__" src="__SCRIPT_URI__"></script>
</body>
</html>
